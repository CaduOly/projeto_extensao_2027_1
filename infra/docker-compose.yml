version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecoalerta_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ecoalerta_db
      MYSQL_USER: ecoalerta_user
      MYSQL_PASSWORD: ecoalerta_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecoalerta_net

  api:
    build:
      context: ../api
      dockerfile: ../infra/Dockerfile.api
    container_name: ecoalerta_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://ecoalerta_user:ecoalerta_password@db:3306/ecoalerta_db"
      PORT: 3000
    depends_on:
      - db
    networks:
      - ecoalerta_net

  app:
    build:
      context: ../app
      dockerfile: ../infra/Dockerfile.app
    container_name: ecoalerta_app
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - ecoalerta_net

volumes:
  mysql_data:

networks:
  ecoalerta_net:
    driver: bridge
